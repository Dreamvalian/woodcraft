name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    env:
      APP_ENV: testing
      APP_DEBUG: false
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          coverage: none

      - name: Install Composer dependencies
        run: |
          composer install --no-interaction --no-progress --prefer-dist

      - name: Setup application key
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Install Node dependencies
        run: |
          npm install

      - name: Build assets
        run: |
          npm run production

      - name: Run tests
        run: |
          php artisan test

